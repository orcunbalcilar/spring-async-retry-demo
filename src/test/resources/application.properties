spring.application.name=spring-currency
# Currency task executor pool configuration
currency.task.executor.core-pool-size=5
currency.task.executor.queue-capacity=100
# Logging configuration
logging.level.io.github.orcunbalcilar.springcurrency=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
